<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Реєстрація</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Inter", sans-serif;
      }

      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .auth-container {
        background: rgba(255, 255, 255, 0.95);
        padding: 2.5rem;
        border-radius: 15px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        width: 100%;
        max-width: 400px;
      }

      .auth-container h2 {
        color: #2d3748;
        text-align: center;
        font-size: 1.8rem;
        margin-bottom: 1.5rem;
        font-weight: 600;
      }

      .input-group {
        margin-bottom: 1.2rem;
      }

      .input-group input {
        width: 100%;
        padding: 0.75rem;
        border: 2px solid #e2e8f0;
        border-radius: 8px;
        font-size: 1rem;
        transition: all 0.3s ease;
        outline: none;
      }

      .input-group input:focus {
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      }

      .auth-button {
        width: 100%;
        padding: 0.75rem;
        background: #667eea;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-top: 1rem;
      }

      .auth-button:hover {
        background: #5a67d8;
      }

      .message {
        margin-top: 1rem;
        padding: 0.75rem;
        border-radius: 8px;
        text-align: center;
        display: none;
      }

      .message.error {
        display: block;
        background-color: #fee2e2;
        color: #dc2626;
        border: 1px solid #fecaca;
      }

      .message.success {
        display: block;
        background-color: #dcfce7;
        color: #16a34a;
        border: 1px solid #bbf7d0;
      }

      .auth-links {
        margin-top: 1.5rem;
        text-align: center;
      }

      .auth-links a {
        color: #667eea;
        text-decoration: none;
        font-size: 0.95rem;
        transition: color 0.3s ease;
      }

      .auth-links a:hover {
        color: #5a67d8;
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="auth-container">
      <h2>Реєстрація</h2>
      <form id="registerForm">
        <div class="input-group">
          <input type="text" id="newUsername" placeholder="Логін" required />
        </div>
        <div class="input-group">
          <input type="email" id="email" placeholder="Email" required />
        </div>
        <div class="input-group">
          <input
            type="password"
            id="newPassword"
            placeholder="Пароль"
            required
          />
        </div>
        <button type="submit" class="auth-button">Зареєструватися</button>
      </form>
      <p id="message" class="message"></p>
      <div class="auth-links">
        <a href="/login">Вже є акаунт?</a>
      </div>
    </div>

    <script>
      const registerForm = document.getElementById("registerForm");
      const messageEl = document.getElementById("message");

      function showMessage(message, isError = true) {
        messageEl.textContent = message;
        messageEl.className = `message ${isError ? "error" : "success"}`;
      }

      registerForm.addEventListener("submit", async (e) => {
        e.preventDefault();

        const username = document.getElementById("newUsername").value;
        const email = document.getElementById("email").value;
        const password = document.getElementById("newPassword").value;

        try {
          const response = await fetch("/api/register", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ username, email, password }),
          });

          if (!response.ok) {
            const errorData = await response.json().catch(() => ({
              message: "Помилка сервера",
            }));
            throw new Error(errorData.message || "Помилка сервера");
          }

          const data = await response.json();

          if (data.success) {
            showMessage("Реєстрація успішна!", false);
            setTimeout(() => {
              window.location.href = "/login";
            }, 1500);
          } else {
            showMessage(data.message || "Помилка реєстрації");
          }
        } catch (error) {
          console.error("Error:", error);
          showMessage(error.message || "Помилка з'єднання з сервером");
        }
      });
    </script>
  </body>
</html>
